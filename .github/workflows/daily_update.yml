name: Daily Market Update

on:
  schedule:
    - cron: '20 13 * * 1-5'   # 6:50 PM IST (13:20 UTC), weekdays after NSE Bhavcopy settles
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Update live index state via NSE MCP & fallback
        run: python scripts/update_live.py

      - name: Commit updated live_state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live_state.json
          git diff --cached --quiet || git commit -m "chore: live market update $(date -u +%Y-%m-%d)"
          git push
